name: Release T3 Science

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without v (for example 2.2.1)
        required: true
        type: string
      android_version_code:
        description: Android version code, greater than every previous APK
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-science
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_VERSION: ${{ inputs.version }}
  T3SCIENCE_ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Validate release and signing credentials
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          T3SCIENCE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          T3SCIENCE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          T3SCIENCE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const { RELEASE_VERSION: version, T3SCIENCE_ANDROID_VERSION_CODE: code } = process.env;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) throw new Error('Use a stable version without v.');
          if (!/^[1-9]\d*$/.test(code) || Number(code) > 2100000000) throw new Error('Invalid Android version code.');
          for (const key of ['ANDROID_KEYSTORE_BASE64', 'T3SCIENCE_ANDROID_STORE_PASSWORD', 'T3SCIENCE_ANDROID_KEY_ALIAS', 'T3SCIENCE_ANDROID_KEY_PASSWORD']) {
            if (!process.env[key]) throw new Error(`Configure GitHub secret for ${key}.`);
          }
          NODE
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists. Choose a new version.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const releases = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/releases.json`, 'utf8'));
          const current = process.env.RELEASE_VERSION.split('.').map(Number);
          for (const release of releases) {
            if (!/^v\d+\.\d+\.\d+$/.test(release.tag_name)) continue;
            const previous = release.tag_name.slice(1).split('.').map(Number);
            const difference = current.map((part, index) => part - previous[index]).find(part => part !== 0) ?? 0;
            if (difference <= 0) throw new Error('Version must exceed every existing stable release.');
            const asset = release.assets.find(asset => asset.name === 'android-update.json');
            if (asset && !release.draft) {
              const response = await fetch(asset.browser_download_url);
              if (!response.ok) throw new Error('Could not verify previous Android version code.');
              const metadata = await response.json();
              if (Number(process.env.T3SCIENCE_ANDROID_VERSION_CODE) <= metadata.versionCode) throw new Error('Android version code must increase.');
            }
          }
          NODE

  quality:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-deps
      - name: Check affected packages
        run: vp run --filter @t3tools/desktop --filter @t3tools/mobile --filter @t3tools/scripts typecheck
      - name: Test update and release behavior
        run: vp test run scripts/build-desktop-artifact.test.ts scripts/prepare-science-release.test.ts apps/mobile/src/features/updates/app-updates.test.ts apps/mobile/app.config.test.ts apps/mobile/android-release-signing.test.ts

  desktop:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            target: AppImage
          - runner: windows-2025
            platform: win
            target: nsis
          - runner: windows-2025
            platform: win
            target: portable
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-ci-deps
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libdbus-1-dev libwayland-dev libgbm-dev libxkbcommon-dev libpipewire-0.3-dev libspa-0.2-dev libegl1-mesa-dev libgl-dev libfuse2 imagemagick
      - name: Build desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: vp run dist:desktop:artifact --platform "${{ matrix.platform }}" --target "${{ matrix.target }}" --arch x64 --build-version "$RELEASE_VERSION" --output-dir release
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/latest-linux.yml

  android:
    needs: preflight
    runs-on: ubuntu-24.04
    env:
      APP_VARIANT: production
      T3CODE_MOBILE_VERSION: ${{ inputs.version }}
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      T3SCIENCE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      T3SCIENCE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      T3SCIENCE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore signing key
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "T3SCIENCE_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed APK
        run: vp run dist:mobile:android --abi all --output "release/T3-Science-$RELEASE_VERSION-android.apk"
      - name: Test Android APK validation
        working-directory: apps/mobile/android
        run: ./gradlew :t3tools-mobile-app-updates:testReleaseUnitTest
      - name: Verify APK signature and version
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose "release/T3-Science-$RELEASE_VERSION-android.apk"
          "$build_tools/aapt" dump badging "release/T3-Science-$RELEASE_VERSION-android.apk" | head -n 1 | grep -F "versionCode='$T3SCIENCE_ANDROID_VERSION_CODE'" | grep -F "versionName='$RELEASE_VERSION'"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: release/*.apk

  draft:
    needs: [quality, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate update manifests
        run: node scripts/prepare-science-release.ts release "$RELEASE_VERSION" "$T3SCIENCE_ANDROID_VERSION_CODE"
      - name: Create draft for manual publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "T3 Science $RELEASE_VERSION" --generate-notes --draft
