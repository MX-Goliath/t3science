name: Build T3 Science Android
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without v (for example 2.2.1)
        required: true
        type: string
      android_version_code:
        description: Android version code, greater than every previous APK
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Stable version without v (for example 2.2.1)
        required: true
        type: string
      android_version_code:
        description: Android version code, greater than every previous APK
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
permissions:
  contents: read
concurrency:
  group: science-android-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  RELEASE_VERSION: ${{ inputs.version }}
  T3SCIENCE_ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      APP_VARIANT: production
      T3CODE_MOBILE_VERSION: ${{ inputs.version }}
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      T3SCIENCE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      T3SCIENCE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      T3SCIENCE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-ci-deps
      - name: Validate Android version and signing credentials
        run: |-
          node --input-type=module <<'NODE'
          const { RELEASE_VERSION: version, T3SCIENCE_ANDROID_VERSION_CODE: code } = process.env;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) throw new Error('Use a stable version without v.');
          if (!/^[1-9]\d*$/.test(code) || Number(code) > 2100000000) throw new Error('Invalid Android version code.');
          for (const key of ['ANDROID_KEYSTORE_BASE64', 'T3SCIENCE_ANDROID_STORE_PASSWORD', 'T3SCIENCE_ANDROID_KEY_ALIAS', 'T3SCIENCE_ANDROID_KEY_PASSWORD']) {
            if (!process.env[key]) throw new Error(`Configure GitHub secret for ${key}.`);
          }
          NODE
      - name: Check Android update code
        run: vp run --filter @t3tools/mobile --filter @t3tools/scripts typecheck
      - name: Test Android update behavior
        run: vp test run apps/mobile/src/features/updates/app-updates.test.ts apps/mobile/app.config.test.ts apps/mobile/android-release-signing.test.ts scripts/prepare-science-release.test.ts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore signing key
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "T3SCIENCE_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Generate native project for validation
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform android --no-install
      - name: Test Android APK validation
        working-directory: apps/mobile/android
        run: ./gradlew :t3tools-mobile-app-updates:testReleaseUnitTest
      - name: Build signed ARM64 APK
        run: vp run dist:mobile:android --abi arm64-v8a --output "release/T3-Science-$RELEASE_VERSION-android.apk"
      - name: Verify APK signature, version and architecture
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose "release/T3-Science-$RELEASE_VERSION-android.apk"
          "$build_tools/aapt" dump badging "release/T3-Science-$RELEASE_VERSION-android.apk" | head -n 1 | grep -F "versionCode='$T3SCIENCE_ANDROID_VERSION_CODE'" | grep -F "versionName='$RELEASE_VERSION'"
          "$build_tools/aapt" dump badging "release/T3-Science-$RELEASE_VERSION-android.apk" | grep -Fx "native-code: 'arm64-v8a'"
      - name: Prepare Android update feed
        run: node scripts/prepare-science-release.ts release "$RELEASE_VERSION" "$T3SCIENCE_ANDROID_VERSION_CODE" --platform android
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          if-no-files-found: error
          path: |-
            release/*.apk
            release/android-update.json
